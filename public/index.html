<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tesla Player</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1c1c1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Player">
<link rel="stylesheet" href="style.css">
<script src="vendor/hls.min.js"></script>
<script src="vendor/mpegts.js"></script>
</head>
<body>
<div class="tab-bar">
  <button class="tab-btn active" data-tab="iptv">IPTV / M3U</button>
  <button class="tab-btn" data-tab="youtube">YouTube</button>
  <button class="tab-btn" data-tab="jellyfin">Jellyfin</button>
  <button class="tab-btn" data-tab="mediaplayer">Media Player</button>
</div>

<div id="iptv" class="tab-content active">
  <button class="drawer-toggle" data-target="iptv">☰ Liste</button>
  <div class="side-panel" id="iptv-side-panel">
    <div class="mode-switch">
      <button id="mode-m3u-btn" class="mode-btn active">M3U</button>
      <button id="mode-xtream-btn" class="mode-btn">Xtream</button>
    </div>

    <div id="m3u-mode">
      <div class="list-picker">
        <select id="m3u-list-select"></select>
        <button id="m3u-list-add" title="Yeni liste ekle">＋</button>
        <button id="m3u-list-rename" title="Adını değiştir">✎</button>
        <button id="m3u-list-delete" title="Listeyi sil">🗑</button>
      </div>
      <div id="m3u-add-form" style="display:none;">
        <input id="m3u-url" placeholder="https://.../liste.m3u">
        <button id="m3u-load-btn">Linkten Yükle</button>
        <p class="or-text">veya dosya seçin</p>
        <input type="file" id="m3u-file" accept=".m3u,.m3u8">
        <button id="m3u-file-load-btn">Dosyadan Yükle</button>
      </div>
      <div id="m3u-channel-list"></div>
    </div>

    <div id="xtream-mode" style="display:none;">
      <div class="list-picker">
        <select id="xt-account-select"></select>
        <button id="xt-acc-add" title="Yeni hesap ekle">＋</button>
        <button id="xt-acc-rename" title="Adını değiştir">✎</button>
        <button id="xt-acc-delete" title="Hesabı sil">🗑</button>
      </div>
      <div id="xt-acc-form" style="display:none;">
        <input id="xt-acc-name" placeholder="Hesap adı (boş bırakılabilir)">
        <input id="xt-acc-server" placeholder="Sunucu: http://adres:port">
        <input id="xt-acc-user" placeholder="Kullanıcı adı" autocomplete="off">
        <input id="xt-acc-pass" placeholder="Şifre" type="password" autocomplete="new-password">
        <button id="xt-acc-save">Kaydet ve Bağlan</button>
      </div>
      <div id="xt-main">
      <div class="xtream-section-switch">
        <button class="xt-sec-btn fav-tab" data-sec="fav">★ Favoriler</button>
        <button class="xt-sec-btn active" data-sec="live">Canlı TV</button>
        <button class="xt-sec-btn" data-sec="vod">Filmler</button>
        <button class="xt-sec-btn" data-sec="series">Diziler</button>
      </div>
      <div id="xt-breadcrumb"></div>
      <div id="xt-list"></div>
      </div>
    </div>
  </div>
  <div class="player-panel" id="iptv-player-panel">
    <button class="fullscreen-btn" data-target="iptv-player-panel">⛶</button>
    <video id="iptv-video" controls autoplay playsinline x-webkit-airplay="allow"></video>
    <div id="iptv-status" class="player-status"></div>
    <div id="mv-controls" class="mv-controls">
      <div id="mv-title" class="mv-title"></div>
      <div class="mv-seekrow">
        <span id="mv-cur">0:00</span>
        <input type="range" id="mv-seek" min="0" max="1000" step="1" value="0">
        <span id="mv-dur">0:00</span>
      </div>
      <div class="mv-row">
        <button id="mv-list" title="Liste">☰</button>
        <button id="mv-back" title="10 sn geri">↺ 10</button>
        <button id="mv-play" class="mv-big" title="Oynat / Durdur">⏸</button>
        <button id="mv-fwd" title="30 sn ileri">30 ↻</button>
        <span class="mv-spacer"></span>
        <button id="mv-audio-btn" title="Ses dili">🔊<span class="mv-lbl"> Ses</span></button>
        <button id="mv-sub-btn" title="Altyazı">💬<span class="mv-lbl"> Altyazı</span></button>
        <button id="mv-pip" title="Resim içinde resim" style="display:none">⧉</button>
      </div>
      <div id="mv-menu" class="mv-menu"></div>
    </div>
    <input type="file" id="mv-sub-file" accept=".srt,.vtt,text/vtt,application/x-subrip" style="display:none">
  </div>
</div>

<div id="youtube" class="tab-content">
  <button class="drawer-toggle" data-target="youtube">☰ Liste</button>
  <div class="mp-layout">
    <div class="mp-browser" id="yt-side-panel">
      <form id="yt-search-form" class="yt-search">
        <input id="yt-q" type="search" placeholder="YouTube'da ara ya da link yapıştır" enterkeyhint="search" autocomplete="off">
        <button type="submit">Ara</button>
      </form>
      <div id="yt-list"></div>
    </div>
    <div class="mp-player" id="yt-player-panel">
      <button class="fullscreen-btn" data-target="yt-player-panel">⛶</button>
      <video id="yt-video" controls playsinline x-webkit-airplay="allow"></video>
    </div>
  </div>
</div>

<div id="jellyfin" class="tab-content">
  <iframe id="jellyfin-frame" src="" allowfullscreen allow="autoplay; fullscreen; picture-in-picture"></iframe>
</div>

<div id="mediaplayer" class="tab-content">
  <button class="drawer-toggle" data-target="mediaplayer">☰ Liste</button>
  <div class="mp-layout">
    <div class="mp-browser" id="mp-side-panel">
      <div id="mp-breadcrumb"></div>
      <div id="mp-list"></div>
    </div>
    <div class="mp-player" id="mp-player-panel">
      <button class="fullscreen-btn" data-target="mp-player-panel">⛶</button>
      <video id="mp-video" controls></video>
      <audio id="mp-audio" controls></audio>
    </div>
  </div>
</div>

<audio id="bg-audio" preload="auto" playsinline></audio>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
